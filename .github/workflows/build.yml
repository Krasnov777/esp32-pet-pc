# Builds the firmware on every push and pull request, and keeps the binary
# as a downloadable artifact.
name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: firmware
        run: pio run -e pet-pc

      - name: Keep the firmware
        uses: actions/upload-artifact@v4
        with:
          name: pet-pc-firmware
          path: |
            firmware/.pio/build/pet-pc/firmware.bin
            firmware/.pio/build/pet-pc/bootloader.bin
            firmware/.pio/build/pet-pc/partitions.bin
