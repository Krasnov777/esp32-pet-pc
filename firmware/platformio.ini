; ─────────────────────────────────────────────────────────────────────────────
; PET-PC — Waveshare ESP32-C6-Zero + SSD1306 128x64 + 3 key switches,
; in a Commodore PET-style case.
;
; Pin map lives in src/board_config.h; wiring is documented in WIRING.md.
;
; PLATFORM: the stock `espressif32` platform only offers ESP-IDF for the C6.
; Arduino core 3.x on the C6 comes from pioarduino, the community-maintained
; continuation of the platform. There is no Waveshare C6-Zero board file, so
; the Espressif C6 DevKitC-1 definition is used with the flash size overridden
; — the Zero's ESP32-C6FH4 has 4 MB in-package, the DevKit has 8 MB.
;
; FIRST FLASH is over the USB-C port (native USB Serial/JTAG, no adapter). If
; the port does not show up, hold BOOT, tap RST, release BOOT. After that,
; `pio run -e ota -t upload` works over WiFi.
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = pet-pc

[env:pet-pc]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = esp32-c6-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ── Flash layout ────────────────────────────────────────────────────────────
; 4 MB part. `min_spiffs` gives two 1.9 MB OTA slots and a small FS we do not
; use; settings live in NVS (see settings.cpp), the web UI in flash constants.
board_upload.flash_size    = 4MB
board_upload.maximum_size  = 4194304
board_build.flash_size     = 4MB
board_build.partitions     = min_spiffs.csv

build_flags =
  -D FW_VERSION=\"1.3.2\"
  ; Route Serial over the USB-C port (USB Serial/JTAG) rather than UART0
  ; on the TX/RX pins, so `pio device monitor` works on the same cable.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++17

; Warnings are scoped to this project's sources — the framework and the
; libraries have their own noise that we cannot fix.
build_src_flags =
  -Wall
  -Wextra

build_unflags =
  -std=gnu++11

lib_deps =
  olikraus/U8g2@^2.35.30
  bblanchon/ArduinoJson@^7.3.0

; ── OTA flavour — flash over WiFi once the firmware is on the device ────────
;   pio run -e ota -t upload
; The password comes from src/secrets.h (OTA_PASSWORD); mirror it here.
; macOS note: if espota hangs resolving the .local name, pass the IP:
;   pio run -e ota -t upload --upload-port <device-ip>
[env:ota]
extends         = env:pet-pc
upload_protocol = espota
upload_port     = pet-pc.local
upload_flags    =
  --auth=pet-pc
  --port=3232
